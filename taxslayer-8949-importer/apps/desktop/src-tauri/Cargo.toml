[package]
name = "tsp8949-importer"
version = "0.1.0"
description = "Import stock and crypto transactions for TaxSlayer Pro Desktop via Form 8949 Exception 2"
authors = ["Kenny McCaskill"]
edition = "2021"

[lib]
name = "tsp8949_importer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
